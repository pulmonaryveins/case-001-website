<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Static paper tile: low-frequency mottling, directional fibers, fine grain. Seamless (stitchTiles). -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .2  1.6 0 0 0 -.62"/>
  </filter>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .5" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .98  0 0 0 0 .94  0 0 0 0 .84  0 2.4 0 0 -1.3"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .23  0 0 0 0 .15  0 0 2.2 0 -1.02"/>
  </filter>
  <rect width="256" height="256" filter="url(#mottle)" opacity=".22"/>
  <rect width="256" height="256" filter="url(#fiber)" opacity=".12"/>
  <rect width="256" height="256" filter="url(#grain)" opacity=".4"/>
</svg>
